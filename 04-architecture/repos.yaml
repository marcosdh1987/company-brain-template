# Code repo registry — the machine-readable side of the systems map.
# `make workspace` clones every repo with `workspace: true` as a SIBLING of
# this brain (hub-and-spoke; see docs/workspace.md). Code repos are never
# submodules of the brain.
#
# harness: which governance release the repo is pinned to (informative).
org: __ORG_NAME__
repos: []
